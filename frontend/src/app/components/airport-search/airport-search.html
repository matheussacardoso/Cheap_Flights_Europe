<mat-form-field appearance="outline" subscriptSizing="dynamic" class="field">
  <mat-label>{{ label() }}</mat-label>
  @if (!editing() && value(); as chosen) {
    <img
      matPrefix
      class="flag"
      [src]="chosen.countryCode | flagUrl"
      alt=""
      width="24"
      height="16"
    />
  }
  <input
    #box
    matInput
    type="text"
    autocomplete="off"
    spellcheck="false"
    [matAutocomplete]="list"
    [placeholder]="placeholder()"
    [disabled]="disabled()"
    [value]="text()"
    (focus)="onFocus(box)"
    (input)="onInput(box.value)"
  />
  @if (value() && !disabled()) {
    <button
      matIconButton
      matSuffix
      type="button"
      [attr.aria-label]="'Clear ' + label()"
      title="Clear"
      (click)="clear(box)"
    >
      <mat-icon>close</mat-icon>
    </button>
  }
  @if (hint()) {
    <mat-hint>{{ hint() }}</mat-hint>
  }
</mat-form-field>

<mat-autocomplete
  #list="matAutocomplete"
  class="airport-options"
  [displayWith]="displayTitle"
  [autoActiveFirstOption]="true"
  (optionSelected)="choose($event.option.value)"
  (closed)="close()"
>
  @for (option of results(); track option.kind + option.code) {
    <mat-option [value]="option">
      <span class="option">
        <img class="flag" [src]="option.countryCode | flagUrl" alt="" width="24" height="16" />
        <span class="text">
          <span class="title">{{ option.title }}</span>
          <span class="subtitle">{{ option.subtitle }}</span>
        </span>
      </span>
    </mat-option>
  } @empty {
    <mat-option disabled>No matching airports</mat-option>
  }
</mat-autocomplete>
<p class="visually-hidden" aria-live="polite">{{ status() }}</p>
