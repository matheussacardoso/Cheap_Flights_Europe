<button
  type="button"
  class="option-card"
  [class.is-selected]="selected()"
  [class.is-highlighted]="highlighted() && !selected()"
  [class.is-unavailable]="unavailable()"
  [attr.aria-pressed]="selected()"
  [attr.aria-disabled]="unavailable() || null"
  (click)="onClick()"
>
  @if (flag(); as code) {
    <img
      class="flag"
      [src]="'flags/' + code.toLowerCase() + '.svg'"
      alt=""
      width="32"
      height="24"
    />
  }
  <span class="text">
    <span class="title">{{ title() }}</span>
    @if (unavailable() && reason()) {
      <span class="subtitle">{{ reason() }}</span>
    } @else if (subtitle()) {
      <span class="subtitle">{{ subtitle() }}</span>
    }
    <ng-content select="[meta]" />
  </span>
</button>
