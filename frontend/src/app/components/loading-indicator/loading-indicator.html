<div class="loading" role="status" aria-live="polite">
  <mat-progress-spinner
    class="spinner"
    mode="indeterminate"
    [diameter]="compact() ? 16 : 32"
    [strokeWidth]="compact() ? 2 : 4"
    aria-hidden="true"
  />
  <div class="text">
    <p class="title">{{ title() }}</p>
    @if (detail() && !compact()) {
      <p class="detail">{{ detail() }}</p>
    }
  </div>
</div>
@if (!compact()) {
  <!-- Indeterminate: the API gives no real progress, so it never fakes a percentage. -->
  <mat-progress-bar mode="indeterminate" aria-hidden="true" />
}
