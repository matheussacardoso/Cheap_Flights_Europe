<section class="saved-routes" aria-labelledby="saved-routes-title">
  <h2 id="saved-routes-title" class="section-title">Saved routes</h2>
  @if (saved.routes().length) {
    <ul class="route-list">
      @for (item of items(); track item.route.id) {
        @let route = item.route;
        <li class="route" [class.is-current]="item.isCurrent">
          <button
            type="button"
            class="route-button"
            [attr.aria-label]="item.name"
            [attr.aria-pressed]="item.isCurrent"
            [attr.aria-disabled]="!trip.airports().length || null"
            (click)="use(route)"
          >
            <img class="flag" [src]="route.originCountry | flagUrl" alt="" width="24" height="16" />
            <span>{{ route.originName }}</span>
            <span class="arrow" aria-hidden="true">→</span>
            <img
              class="flag"
              [src]="route.destinationCountry | flagUrl"
              alt=""
              width="24"
              height="16"
            />
            <span>{{ route.destinationName }}</span>
          </button>
          <button
            type="button"
            class="remove-button"
            [attr.aria-label]="'Remove ' + item.name"
            title="Remove"
            (click)="remove(route)"
          >
            <span aria-hidden="true">×</span>
          </button>
        </li>
      }
    </ul>
  } @else {
    <p class="hint">Save a route to find it here, or upload a routes file.</p>
  }
  <div class="file-actions">
    @if (saved.routes().length) {
      <button type="button" class="btn btn-outline" (click)="download()">
        <span aria-hidden="true">↓</span> Download file
      </button>
    }
    <button
      type="button"
      class="btn btn-outline"
      [disabled]="!trip.airports().length"
      (click)="fileInput.click()"
    >
      <span aria-hidden="true">↑</span> Upload file
    </button>
    <input
      #fileInput
      type="file"
      class="visually-hidden"
      accept=".json,application/json"
      tabindex="-1"
      aria-hidden="true"
      (change)="upload(fileInput)"
    />
  </div>
  @if (fileMessage(); as status) {
    <!-- Visible only; the polite live region below announces it. -->
    <p class="file-status" [class.error]="status.isError">{{ status.text }}</p>
  }
</section>
<p class="visually-hidden" aria-live="polite">{{ message() }}</p>
